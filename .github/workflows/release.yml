# Builds the Windows installer and publishes it as a GitHub release.
# Run it by pushing a version tag, e.g.  npm version patch  then  git push --follow-tags
# Installed copies of Mog Browser check these releases and update themselves.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
