# Builds the Windows installer and publishes it as a GitHub release.
# Run it by pushing a version tag, e.g.  npm version patch  then  git push --follow-tags
# Installed copies of Mog Browser check these releases and update themselves.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Create the release up front. Otherwise electron-builder's parallel uploads can each create
      # their own release for the same tag, splitting the installer and latest.yml apart.
      - name: Create release
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Mog Browser ${GITHUB_REF_NAME#v}" --notes "Download **MogBrowser-Setup.exe** below and run it. Installed copies update automatically."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
