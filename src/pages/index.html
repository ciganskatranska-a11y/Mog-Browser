<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' mog:; img-src 'self' mog: https: data:; media-src https: http:; style-src 'self'; script-src 'self'">
	<title>New tab</title>
	<link rel="icon" href="mog://booster/icons/icon32.png">
	<link rel="stylesheet" href="newtab.css">
</head>
<body>
	<svg hidden>
		<symbol id="i-image" viewBox="0 0 16 16"><path d="M2.5 3h11v10h-11zM2.5 11l3.2-3.2L8 10l2-2 3.5 3.5"/></symbol>
		<symbol id="i-bookmark" viewBox="0 0 16 16"><path d="M4.5 2.5h7v11L8 11l-3.5 2.5z"/></symbol>
		<symbol id="i-history" viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7M2.5 2.8v3.4h3.4M8 5v3.2l2.2 1.4"/></symbol>
		<symbol id="i-volume" viewBox="0 0 16 16"><path d="M2.5 6h2.5l3.5-3v10L5 10H2.5zM11 5.5a3.5 3.5 0 0 1 0 5M12.7 3.5a6 6 0 0 1 0 9"/></symbol>
		<symbol id="i-settings" viewBox="0 0 16 16"><path d="M2.5 4.5h5M11.5 4.5h2M2.5 11.5h2M8.500 11.5h5M7.5 2.5h4v4h-4zM4.5 9.5h4v4h-4z"/></symbol>
		<symbol id="i-close" viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></symbol>
		<symbol id="i-search" viewBox="0 0 16 16"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.4 10.4l3.1 3.1"/></symbol>
		<symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
		<symbol id="i-edit" viewBox="0 0 16 16"><path d="M3 13h3l7-7-3-3-7 7zM9 4l3 3"/></symbol>
		<symbol id="i-layout" viewBox="0 0 16 16"><path d="M2.5 2.5h6v5h-6zM10.5 2.5h3v8h-3zM2.5 9.5h6v4h-6zM10.5 12.5h3"/></symbol>
		<symbol id="i-gear" viewBox="0 0 16 16"><path d="M2.5 5h6M11.5 5h2M2.5 11h2M7.5 11h6M8.500 3.500h3v3h-3zM4.500 9.500h3v3h-3z"/></symbol>
		<symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.500 12 8l-7 4.500z"/></symbol>
		<symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.500 3.500v9M10.500 3.500v9"/></symbol>
		<symbol id="i-next" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></symbol>
		<symbol id="i-prev" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></symbol>
	</svg>

	<div id="backdrop" class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

	<main id="canvas" class="canvas"></main>
	<i id="guideX" class="guide is-x" hidden></i>
	<i id="guideY" class="guide is-y" hidden></i>

	<div id="editBar" class="edit-bar" inert>
		<span>Drag widgets anywhere. Pull a corner to resize.</span>
		<button id="editAdd" type="button" class="chip"><svg><use href="#i-plus"/></svg>Add widget</button>
		<button id="editReset" type="button" class="chip is-quiet">Reset layout</button>
		<button id="editDone" type="button" class="chip">Done</button>
	</div>

	<footer class="dock">
		<button id="editLayout" type="button" title="Move, add and remove widgets" aria-pressed="false"><svg><use href="#i-layout"/></svg></button>
		<button id="openCustomize" type="button" data-i18n-title="customize" title="Customize"><svg><use href="#i-image"/></svg></button>
		<a href="mog://settings/#bookmarks" data-i18n-title="bookmarks" title="Bookmarks"><svg><use href="#i-bookmark"/></svg></a>
		<a href="mog://settings/#history" data-i18n-title="history" title="History"><svg><use href="#i-history"/></svg></a>
		<a href="mog://booster/options.html" data-i18n-title="boosterSettings" title="Booster settings"><svg><use href="#i-volume"/></svg></a>
		<a href="mog://settings/" data-i18n-title="settings" title="Settings and themes"><svg><use href="#i-settings"/></svg></a>
	</footer>

	<div id="scrim" class="scrim"></div>

	<aside id="customize" class="customize" inert>
		<div class="customize-head">
			<h2 data-i18n="customize">Customize</h2>
			<button id="closeCustomize" type="button" class="mini" aria-label="Close"><svg><use href="#i-close"/></svg></button>
		</div>
		<h3 data-i18n="widgets">Widgets</h3>
		<div class="buttons">
			<button id="customEdit" class="button" type="button">Move widgets</button>
			<button id="customAdd" class="button" type="button">Add widget</button>
		</div>
		<h3 data-i18n="themes">Themes</h3>
		<div id="themes" class="swatches"></div>
		<h3 data-i18n="countries">Countries</h3>
		<div id="countries" class="swatches"></div>
		<h3 data-i18n="background">Background image</h3>
		<div class="buttons">
			<label class="button"><span data-i18n="choose">Choose image</span><input id="backgroundFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
			<button id="removeBackground" class="button" type="button" data-i18n="remove">Remove</button>
		</div>
		<label class="field"><span data-i18n="dim">Dim background</span><input id="dim" type="range" min="0" max="90" step="5"></label>
		<label class="row spaced"><span data-i18n="china">China mode 中文模式</span><input id="chinaMode" type="checkbox" role="switch"></label>
		<div class="buttons spaced">
			<button id="resetSites" class="button" type="button" data-i18n="resetSites">Reset tiles</button>
		</div>
		<p class="note">Hold Ctrl and scroll on this page to make the whole browser bigger or smaller.</p>
	</aside>

	<aside id="gallery" class="customize" inert>
		<div class="customize-head">
			<h2>Add widget</h2>
			<button id="closeGallery" type="button" class="mini" aria-label="Close"><svg><use href="#i-close"/></svg></button>
		</div>
		<div id="galleryList" class="gallery"></div>
	</aside>

	<div id="options" class="options" hidden></div>

	<script src="theme.js"></script>
	<script src="widgets.js"></script>
	<script src="newtab.js"></script>
</body>
</html>
