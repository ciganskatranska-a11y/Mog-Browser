<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' mog:; img-src 'self' mog: https: data:; style-src 'self'; script-src 'self'">
	<title>New tab</title>
	<link rel="icon" href="mog://booster/icons/icon32.png">
	<link rel="stylesheet" href="newtab.css">
</head>
<body>
	<svg hidden>
		<symbol id="i-image" viewBox="0 0 16 16"><path d="M2.5 3h11v10h-11zM2.5 11l3.2-3.2L8 10l2-2 3.5 3.5"/></symbol>
		<symbol id="i-bookmark" viewBox="0 0 16 16"><path d="M4.5 2.5h7v11L8 11l-3.5 2.5z"/></symbol>
		<symbol id="i-history" viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7M2.5 2.8v3.4h3.4M8 5v3.2l2.2 1.4"/></symbol>
		<symbol id="i-volume" viewBox="0 0 16 16"><path d="M2.5 6h2.5l3.5-3v10L5 10H2.5zM11 5.5a3.5 3.5 0 0 1 0 5M12.7 3.5a6 6 0 0 1 0 9"/></symbol>
		<symbol id="i-settings" viewBox="0 0 16 16"><path d="M2.5 4.5h5M11.5 4.5h2M2.5 11.5h2M8.500 11.5h5M7.5 2.5h4v4h-4zM4.5 9.5h4v4h-4z"/></symbol>
		<symbol id="i-close" viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></symbol>
		<symbol id="i-search" viewBox="0 0 16 16"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.4 10.4l3.1 3.1"/></symbol>
	</svg>

	<div id="backdrop" class="backdrop"></div>

	<header class="top">
		<div id="stats" class="stats">
			<div class="stat">
				<strong id="blocked">0</strong>
				<span data-i18n="blocked">ads and trackers mogged</span>
			</div>
			<div class="stat">
				<strong id="tier">Normie</strong>
				<span id="tierNext" data-i18n="rating">Shields rating</span>
			</div>
		</div>
		<div id="clock" class="clock">
			<strong id="time">00:00</strong>
			<span id="date"></span>
		</div>
	</header>

	<main>
		<img src="mog://booster/icons/icon128.png" alt="" class="logo">
		<h1 id="homeTitle">MOG BROWSER</h1>
		<p id="homeTagline" class="tagline"></p>

		<div class="search-box">
			<div id="searchModes" class="modes" role="tablist" aria-label="Search mode"></div>
			<form id="search" class="search">
				<svg><use href="#i-search"/></svg>
				<input name="q" type="text" aria-label="Search" autocomplete="off" autofocus>
				<button type="submit" data-i18n="search">Search</button>
			</form>
		</div>

		<nav id="sites" class="sites" aria-label="Sites"></nav>
	</main>

	<footer class="dock">
		<button id="openCustomize" type="button" data-i18n-title="customize" title="Customize"><svg><use href="#i-image"/></svg></button>
		<a href="mog://settings/#bookmarks" data-i18n-title="bookmarks" title="Bookmarks"><svg><use href="#i-bookmark"/></svg></a>
		<a href="mog://settings/#history" data-i18n-title="history" title="History"><svg><use href="#i-history"/></svg></a>
		<a href="mog://booster/options.html" data-i18n-title="boosterSettings" title="Booster settings"><svg><use href="#i-volume"/></svg></a>
		<a href="mog://settings/" data-i18n-title="settings" title="Settings and themes"><svg><use href="#i-settings"/></svg></a>
	</footer>

	<aside id="customize" class="customize" hidden>
		<div class="customize-head">
			<h2 data-i18n="customize">Customize</h2>
			<button id="closeCustomize" type="button" aria-label="Close"><svg><use href="#i-close"/></svg></button>
		</div>
		<h3 data-i18n="themes">Themes</h3>
		<div id="themes" class="swatches"></div>
		<h3 data-i18n="background">Background image</h3>
		<div class="buttons">
			<label class="button"><span data-i18n="choose">Choose image</span><input id="backgroundFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
			<button id="removeBackground" class="button" type="button" data-i18n="remove">Remove</button>
		</div>
		<label class="field"><span data-i18n="dim">Dim background</span><input id="dim" type="range" min="0" max="90" step="5"></label>
		<label class="row"><span data-i18n="showClock">Clock</span><input id="showClock" type="checkbox" role="switch" data-home="showClock"></label>
		<label class="row"><span data-i18n="showStats">Shields stats</span><input id="showStats" type="checkbox" role="switch" data-home="showStats"></label>
		<label class="row"><span data-i18n="showSites">Site tiles</span><input id="showSites" type="checkbox" role="switch" data-home="showSites"></label>
		<label class="row"><span data-i18n="china">China mode 中文模式</span><input id="chinaMode" type="checkbox" role="switch"></label>
	</aside>

	<script src="theme.js"></script>
	<script src="newtab.js"></script>
</body>
</html>
