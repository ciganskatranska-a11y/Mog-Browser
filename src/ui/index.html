<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src *; child-src *; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; font-src 'self'">
	<title>Mog Browser</title>
	<link rel="stylesheet" href="ui.css">
	<link rel="stylesheet" href="motion.css">
</head>
<body>
	<svg hidden>
		<symbol id="i-back" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></symbol>
		<symbol id="i-forward" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></symbol>
		<symbol id="i-reload" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3"/></symbol>
		<symbol id="i-stop" viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></symbol>
		<symbol id="i-home" viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5V13h-4V9.5h-3V13h-4z"/></symbol>
		<symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
		<symbol id="i-star" viewBox="0 0 16 16"><path d="m8 2.5 1.7 3.6 3.8.5-2.8 2.7.7 3.9L8 11.3l-3.4 1.9.7-3.9-2.8-2.7 3.8-.5z"/></symbol>
		<symbol id="i-menu" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11m-11 3.5h11"/></symbol>
		<symbol id="i-check" viewBox="0 0 16 16"><path d="m3 8.5 3.2 3L13 4.5"/></symbol>
		<symbol id="i-lock" viewBox="0 0 16 16"><path d="M2.5 2.5h4M2.5 2.5v4M13.5 2.5h-4M13.5 2.5v4M2.5 13.5h4M2.5 13.5v-4M13.5 13.5h-4M13.5 13.5v-4M6.5 6.5h3v3h-3z"/></symbol>
		<symbol id="i-shield" viewBox="0 0 16 16"><path d="M8 2 3 4v4c0 3 2.2 5 5 6 2.8-1 5-3 5-6V4z"/></symbol>
	</svg>

	<header id="chrome">
		<div class="strip">
			<img class="brand" src="../../booster/icons/icon48.png" alt="">
			<div id="tabs" class="tab-row" role="tablist"></div>
			<button id="newTab" class="icon" type="button" data-i18n-title="newTab" title="New tab"><svg><use href="#i-plus"/></svg></button>
			<div class="drag"></div>
		</div>

		<div class="toolbar">
			<button id="back" class="icon" type="button" title="Back (Alt+Left)" aria-label="Back"><svg><use href="#i-back"/></svg></button>
			<button id="forward" class="icon" type="button" title="Forward (Alt+Right)" aria-label="Forward"><svg><use href="#i-forward"/></svg></button>
			<button id="reload" class="icon" type="button" title="Reload (Ctrl+R)" aria-label="Reload"><svg class="when-idle"><use href="#i-reload"/></svg><svg class="when-loading"><use href="#i-stop"/></svg></button>
			<button id="home" class="icon" type="button" title="Home (Alt+Home)" aria-label="Home"><svg><use href="#i-home"/></svg></button>

			<form id="urlForm" class="address">
				<span class="halo" aria-hidden="true"></span>
				<span id="secure" class="secure"></span>
				<button id="mode" class="mode" type="button" title="Search mode. Click to switch, or type image: or video: before your search."></button>
				<input id="url" type="text" aria-label="Address and search bar" autocomplete="off" spellcheck="false">
				<button id="star" class="icon small" type="button" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page"><svg><use href="#i-star"/></svg></button>
				<ul id="suggestions" class="suggestions" role="listbox"></ul>
			</form>

			<button id="download" class="download" type="button" aria-live="polite"><svg><use href="#i-check"/></svg><span id="downloadName"></span><i id="downloadBar"></i></button>
			<button id="lockIn" class="pill lock" type="button" title="Lock In mode (Ctrl+Shift+L)" aria-pressed="false"><svg><use href="#i-lock"/></svg><span id="lockTimer" class="lock-timer">25:00</span></button>
			<button id="shields" class="pill" type="button" title="Shields" aria-haspopup="true">
				<svg><use href="#i-shield"/></svg><span class="pill-name" data-i18n="shields">Shields</span><span id="shieldCount" class="pill-count">0</span>
			</button>
			<button id="booster" class="pill booster" type="button" title="Blackpill Booster (Ctrl+Shift+B)" aria-haspopup="true">
				<img src="../../booster/icons/icon32.png" alt=""><span class="pill-name" data-i18n="booster">Booster</span><span id="boosterBadge" class="pill-count" hidden></span>
			</button>
			<button id="menu" class="icon" type="button" title="Menu" aria-label="Menu" aria-haspopup="true"><svg><use href="#i-menu"/></svg></button>
		</div>

		<nav id="bookmarks" class="bookmarks" aria-label="Bookmarks"></nav>
		<div id="progress" class="progress"></div>
		<form id="find" class="find">
			<input id="findText" type="text" placeholder="Find on page" aria-label="Find on page" autocomplete="off" spellcheck="false">
			<output id="findCount">0/0</output>
			<button id="findPrevious" class="icon small" type="button" aria-label="Previous match"><svg class="turn-up"><use href="#i-back"/></svg></button>
			<button id="findNext" class="icon small" type="submit" aria-label="Next match"><svg class="turn-down"><use href="#i-back"/></svg></button>
			<button id="findClose" class="icon small" type="button" aria-label="Close find bar"><svg><use href="#i-stop"/></svg></button>
		</form>
	</header>

	<main id="views"></main>

	<section id="shieldPanel" class="panel" inert>
		<h2 data-i18n="shields">Shields</h2>
		<p class="big-number"><output id="panelCount">0</output><span>ads and trackers mogged on this page</span></p>
		<p id="panelTotal" class="hint"></p>
		<label class="row"><span id="siteLabel">Shields on this site</span><input id="siteShield" type="checkbox" role="switch"></label>
		<hr>
		<label class="row"><span>Block ads and trackers everywhere</span><input id="optShields" type="checkbox" role="switch"></label>
		<label class="row"><span>Block cross-site cookies</span><input id="optCookies" type="checkbox" role="switch"></label>
		<label class="row"><span>Strip tracking from links</span><input id="optParams" type="checkbox" role="switch"></label>
		<p class="hint">Also on: Global Privacy Control, Do Not Track, trimmed cross-site referrers, and a prompt before any site uses your camera, microphone or location. Changes apply after you reload the page.</p>
	</section>

	<section id="menuPanel" class="panel menu" inert>
		<button type="button" data-action="new-tab"><span data-i18n="newTab">New tab</span><kbd>Ctrl+T</kbd></button>
		<button type="button" data-action="new-private"><span data-i18n="newPrivate">New private tab</span><kbd>Ctrl+Shift+N</kbd></button>
		<hr>
		<p class="menu-label" data-i18n="themes">Themes</p>
		<div id="menuThemes" class="swatches"></div>
		<label class="row menu-row"><span data-i18n="china">China mode 中文模式</span><input id="chinaMode" type="checkbox" role="switch"></label>
		<hr>
		<button type="button" data-action="lock-in"><span>Lock In mode</span><kbd>Ctrl+Shift+L</kbd></button>
		<button type="button" data-action="settings"><span data-i18n="settings">Settings and themes</span><kbd>Ctrl+,</kbd></button>
		<button type="button" data-action="booster-settings"><span data-i18n="boosterSettings">Booster settings</span></button>
		<button type="button" data-action="find"><span data-i18n="find">Find on page</span><kbd>Ctrl+F</kbd></button>
		<button type="button" data-action="screenshot"><span data-i18n="screenshot">Save screenshot</span><kbd>Ctrl+Shift+S</kbd></button>
		<button type="button" data-action="zoom-in"><span data-i18n="zoomIn">Zoom in</span><kbd>Ctrl +</kbd></button>
		<button type="button" data-action="zoom-out"><span data-i18n="zoomOut">Zoom out</span><kbd>Ctrl −</kbd></button>
		<button type="button" data-action="fullscreen"><span data-i18n="fullscreen">Full screen</span><kbd>F11</kbd></button>
		<button type="button" data-action="devtools"><span data-i18n="devtools">Developer tools</span><kbd>F12</kbd></button>
		<hr>
		<button type="button" data-action="update"><span data-i18n="update">Check for updates</span><kbd id="version"></kbd></button>
		<button type="button" data-action="clear-data" class="danger"><span data-i18n="clear">Clear browsing data</span></button>
	</section>

	<section id="boosterPanel" class="panel booster-panel" inert></section>
	<p id="toast" class="toast" role="status"></p>
	<p id="tip" class="tip" role="tooltip"></p>

	<script src="../pages/theme.js"></script>
	<script src="ui.js"></script>
</body>
</html>
